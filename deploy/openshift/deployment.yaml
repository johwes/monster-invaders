apiVersion: apps/v1
kind: Deployment
metadata:
  name: wizards-ward
  labels:
    app: wizards-ward
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wizards-ward
  template:
    metadata:
      labels:
        app: wizards-ward
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Substitute <project> with the target namespace before apply, e.g.:
          # sed -i "s/<project>/$(oc project -q)/" deploy/openshift/deployment.yaml
          image: image-registry.openshift-image-registry.svc:5000/<project>/wizards-ward:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
